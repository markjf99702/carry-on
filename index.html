<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Carry On</title>
  <meta name="description" content="A packing list that knows the trip. Keep everything you might pack in one list, sorted by bag; each trip gets its own fresh copy matched to the forecast, where you’re going and what you’ll be doing, with a second pass for coming home.">
  <meta property="og:title" content="Carry On">
  <meta property="og:description" content="A packing list, by bag, that checks the forecast and the place.">
  <meta property="og:image" content="https://carry-on.junkdrawer.works/og.png">
  <meta property="og:url" content="https://carry-on.junkdrawer.works/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#f2ede4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12151b" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preload" href="fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="bar">
    <a class="brand" href="#/">
      <img src="icon.svg" alt="" width="30" height="30">
      <span>Carry On</span>
    </a>
    <button type="button" class="icon-btn cloud" id="cloud" hidden></button>
    <a class="bar-link" href="#/list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01" stroke-width="3"/></svg>My list</a>
    <a class="icon-btn" href="#/settings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg></a>
  </header>

  <main id="app" tabindex="-1"></main>
  <noscript><p class="noscript">Carry On needs JavaScript to put your packing list together.</p></noscript>

  <footer class="jd-foot">
    <a href="https://junkdrawer.works/">Part of junkdrawer.works</a>
    <span aria-hidden="true">·</span>
    <a href="https://junkdrawer.works/privacy.html">Privacy</a>
    <span aria-hidden="true">·</span>
    <a href="https://github.com/markjf99702/carry-on">Source</a>
  </footer>

  <div class="toast" id="toast" hidden></div>
  <div class="sr-only" id="said" role="status"></div>

  <dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
    <form method="dialog" class="sheet-body"></form>
    <div class="sr-only" id="sheetSaid" role="status"></div>
  </dialog>
</body>
</html>
